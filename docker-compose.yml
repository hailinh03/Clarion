version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Clarion — docker-compose.yml
# Services: Qdrant (vector DB) + Redis (Celery broker)
# Chạy: docker compose up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ── Qdrant Vector Database ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: clarion-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Không cần API key cho local dev — KHÔNG set QDRANT__SERVICE__API_KEY
      # (set thành "" sẽ bật auth với empty key → lỗi 401)
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ (Celery broker) ────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clarion-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (Database chính & Lưu trạng thái Task) ───────────
  postgres:
    image: postgres:15-alpine
    container_name: clarion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clarion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clarion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
    driver: local
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
