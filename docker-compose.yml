version: "3.9"

# ─────────────────────────────────────────────────────────────────
# Clarion — docker-compose.yml
# Services: Qdrant (vector DB) + Redis (Celery broker)
# Chạy: docker compose up -d
# ─────────────────────────────────────────────────────────────────

services:

  # ── Qdrant Vector Database ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: clarion-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      # Không cần API key cho local dev — KHÔNG set QDRANT__SERVICE__API_KEY
      # (set thành "" sẽ bật auth với empty key → lỗi 401)
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + result backend) ──────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: clarion-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local
